services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: safesport
      POSTGRES_USER: safesport
      POSTGRES_PASSWORD: safesport
    ports:
      - "5432:5432"
    volumes:
      - safesport_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safesport -d safesport"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - safesport_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  safesport_postgres:
  safesport_uploads:
