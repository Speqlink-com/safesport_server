services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: safesport
      POSTGRES_USER: safesport
      POSTGRES_PASSWORD: safesport
    ports:
      - "5432:5432"
    volumes:
      - safesport_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safesport -d safesport"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      POSE_MODEL: /opt/models/yolo11n-pose.pt
    ports:
      - "${SAFESPORT_PORT:-8000}:8000"
    volumes:
      - .:/app
      - safesport_uploads:/app/uploads
    command: sh -c "uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy

volumes:
  safesport_postgres:
  safesport_uploads:
