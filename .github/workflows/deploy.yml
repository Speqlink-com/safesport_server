name: Deploy SafeSport API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safesport-production
  cancel-in-progress: false

env:
  DOCKERHUB_USERNAME: comphortinoe
  IMAGE_NAME: safesport-server
  DEPLOY_DIR: /home/deploy/apps/safesport

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run tests
        run: uv run --frozen pytest -q

  deploy:
    name: Deploy production
    needs: test
    runs-on: [self-hosted, linux, x64, safesport-prod]
    timeout-minutes: 35
    environment: production
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Verify deployment configuration
        env:
          DOCKERHUB_TOKEN: ${{ secrets.SAFESPORT_DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ZOHO_SMTP_USERNAME: ${{ secrets.ZOHO_SMTP_USERNAME }}
          ZOHO_SMTP_PASSWORD: ${{ secrets.ZOHO_SMTP_PASSWORD }}
          ZOHO_FROM_EMAIL: ${{ secrets.ZOHO_FROM_EMAIL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_MODEL_NAME: ${{ secrets.AZURE_OPENAI_MODEL_NAME }}
          FRONTEND_URL: ${{ vars.SAFESPORT_FRONTEND_URL || vars.FRONTEND_URL || secrets.SAFESPORT_FRONTEND_URL || secrets.FRONTEND_URL }}
        run: |
          required=(
            DOCKERHUB_TOKEN POSTGRES_PASSWORD SECRET_KEY
            ZOHO_SMTP_USERNAME ZOHO_SMTP_PASSWORD
            ZOHO_FROM_EMAIL CLOUDINARY_CLOUD_NAME CLOUDINARY_API_KEY
            CLOUDINARY_API_SECRET AZURE_OPENAI_ENDPOINT AZURE_OPENAI_API_KEY
            AZURE_OPENAI_DEPLOYMENT AZURE_OPENAI_MODEL_NAME
          )
          for variable in "${required[@]}"; do
            if [ -z "${!variable}" ]; then
              echo "Required production setting is missing: ${variable}"
              exit 1
            fi
          done
          if [ -z "$FRONTEND_URL" ]; then
            echo "Required frontend URL is missing."
            echo "Define SAFESPORT_FRONTEND_URL or FRONTEND_URL as a GitHub variable or secret."
            echo "If it is environment-scoped, add it to the production environment."
            exit 1
          fi
          if [ "${#SECRET_KEY}" -lt 32 ]; then
            echo "SECRET_KEY must contain at least 32 characters"
            exit 1
          fi
          if [[ ! "$POSTGRES_PASSWORD" =~ ^[A-Za-z0-9_-]{32,}$ ]]; then
            echo "POSTGRES_PASSWORD must be at least 32 URL-safe characters"
            exit 1
          fi

      - name: Verify server-managed TLS certificate
        run: |
          if [ ! -s "$DEPLOY_DIR/certs/cert.pem" ] || [ ! -s "$DEPLOY_DIR/certs/key.pem" ]; then
            echo "Missing Cloudflare Origin Certificate files"
            echo "Expected $DEPLOY_DIR/certs/cert.pem and key.pem"
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.SAFESPORT_DOCKERHUB_TOKEN }}

      - name: Build and push immutable image
        env:
          IMAGE_REPOSITORY: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
        run: |
          docker pull "$IMAGE_REPOSITORY:latest" || true
          docker build \
            --cache-from "$IMAGE_REPOSITORY:latest" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --tag "$IMAGE_REPOSITORY:${GITHUB_SHA}" \
            --tag "$IMAGE_REPOSITORY:latest" \
            .
          docker push "$IMAGE_REPOSITORY:${GITHUB_SHA}"
          docker push "$IMAGE_REPOSITORY:latest"

      - name: Write server configuration
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ZOHO_SMTP_USERNAME: ${{ secrets.ZOHO_SMTP_USERNAME }}
          ZOHO_SMTP_PASSWORD: ${{ secrets.ZOHO_SMTP_PASSWORD }}
          ZOHO_FROM_EMAIL: ${{ secrets.ZOHO_FROM_EMAIL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          MOVEMENT_CLOUDINARY_CLOUD_NAME: ${{ secrets.MOVEMENT_CLOUDINARY_CLOUD_NAME }}
          MOVEMENT_CLOUDINARY_API_KEY: ${{ secrets.MOVEMENT_CLOUDINARY_API_KEY }}
          MOVEMENT_CLOUDINARY_API_SECRET: ${{ secrets.MOVEMENT_CLOUDINARY_API_SECRET }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_MODEL_NAME: ${{ secrets.AZURE_OPENAI_MODEL_NAME }}
          FRONTEND_URL: ${{ vars.SAFESPORT_FRONTEND_URL || vars.FRONTEND_URL || secrets.SAFESPORT_FRONTEND_URL || secrets.FRONTEND_URL }}
        run: |
          install -d -m 700 "$DEPLOY_DIR"
          install -d -m 700 "$DEPLOY_DIR/certs"
          install -m 600 docker-compose.prod.yml "$DEPLOY_DIR/docker-compose.prod.yml"
          install -m 644 nginx.conf "$DEPLOY_DIR/nginx.conf"
          if [ ! -s "$DEPLOY_DIR/certs/cert.pem" ] || [ ! -s "$DEPLOY_DIR/certs/key.pem" ]; then
            echo "Missing Cloudflare Origin Certificate files"
            echo "Expected $DEPLOY_DIR/certs/cert.pem and key.pem"
            exit 1
          fi
          umask 077
          {
            printf '%s\n' \
              "ENVIRONMENT=production" \
              "DATABASE_URL=postgresql+psycopg://safesport:$POSTGRES_PASSWORD@safesport-postgres:5432/safesport" \
              "SECRET_KEY=$SECRET_KEY" \
              "ACCESS_TOKEN_EXPIRE_MINUTES=15" \
              "REFRESH_TOKEN_EXPIRE_DAYS=7" \
              "OTP_EXPIRE_MINUTES=10" \
              "PASSWORD_RESET_EXPIRE_MINUTES=30" \
              "FRONTEND_URL=$FRONTEND_URL" \
              "BACKEND_PUBLIC_URL=https://server.ayothealthsolutions.ke" \
              "CORS_ORIGINS=$FRONTEND_URL" \
              "COOKIE_SECURE=true" \
              "COOKIE_SAMESITE=lax" \
              "COOKIE_DOMAIN=.ayothealthsolutions.ke" \
              "ZOHO_SMTP_HOST=smtp.zoho.com" \
              "ZOHO_SMTP_PORT=587" \
              "ZOHO_SMTP_USERNAME=$ZOHO_SMTP_USERNAME" \
              "ZOHO_SMTP_PASSWORD=$ZOHO_SMTP_PASSWORD" \
              "ZOHO_FROM_EMAIL=$ZOHO_FROM_EMAIL" \
              "ZOHO_FROM_NAME=SafeSport" \
              "EMAIL_DELIVERY_MODE=smtp" \
              "UPLOADS_DIR=/app/uploads" \
              "MAX_LOGO_BYTES=2097152" \
              "CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME" \
              "CLOUDINARY_API_KEY=$CLOUDINARY_API_KEY" \
              "CLOUDINARY_API_SECRET=$CLOUDINARY_API_SECRET" \
              "CLOUDINARY_INSTITUTION_FOLDER=safesport/institutions" \
              "MOVEMENT_CLOUDINARY_CLOUD_NAME=$MOVEMENT_CLOUDINARY_CLOUD_NAME" \
              "MOVEMENT_CLOUDINARY_API_KEY=$MOVEMENT_CLOUDINARY_API_KEY" \
              "MOVEMENT_CLOUDINARY_API_SECRET=$MOVEMENT_CLOUDINARY_API_SECRET" \
              "MOVEMENT_CLOUDINARY_FOLDER=safesport/movement/originals" \
              "AZURE_OPENAI_ENDPOINT=$AZURE_OPENAI_ENDPOINT" \
              "AZURE_OPENAI_API_KEY=$AZURE_OPENAI_API_KEY" \
              "AZURE_OPENAI_DEPLOYMENT=$AZURE_OPENAI_DEPLOYMENT" \
              "AZURE_OPENAI_MODEL_NAME=$AZURE_OPENAI_MODEL_NAME" \
              "AZURE_OPENAI_API_VERSION=2025-04-01-preview" \
              "AZURE_OPENAI_API_MODE=auto" \
              "LLM_PROVIDER=azure_openai" \
              "POSE_PROVIDER=yolo11" \
              "POSE_MODEL=/opt/models/yolo11n-pose.pt" \
              "POSE_DEVICE=cpu" \
              "POSE_CONFIDENCE_THRESHOLD=0.50" \
              "MOVEMENT_TEMP_DIR=/tmp/safesport" \
              "MOVEMENT_MIN_WIDTH=720" \
              "MOVEMENT_MIN_HEIGHT=720" \
              "MOVEMENT_MIN_FPS=24" \
              "MOVEMENT_MIN_DURATION_SECONDS=1" \
              "MOVEMENT_MAX_DURATION_SECONDS=60" \
              "AI_JOB_MAX_RETRIES=3" \
              "AI_QUEUE_POLL_SECONDS=1"
          } > "$DEPLOY_DIR/.env.prod"
          {
            printf '%s\n' \
              "DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME" \
              "IMAGE_TAG=$GITHUB_SHA" \
              "POSTGRES_DB=safesport" \
              "POSTGRES_USER=safesport" \
              "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
          } > "$DEPLOY_DIR/.env.compose"

      - name: Deploy database and API
        run: |
          cd "$DEPLOY_DIR"
          compose=(docker compose --env-file .env.compose -f docker-compose.prod.yml)
          "${compose[@]}" pull
          "${compose[@]}" up -d safesport-postgres

          database_ready=false
          for _ in {1..30}; do
            if docker exec safesport-postgres pg_isready -U safesport -d safesport >/dev/null 2>&1; then
              database_ready=true
              break
            fi
            sleep 3
          done
          if [ "$database_ready" != true ]; then
            docker logs --tail 100 safesport-postgres
            exit 1
          fi

          "${compose[@]}" run --rm --no-deps safesport-api uv run --no-sync alembic upgrade head
          "${compose[@]}" up -d --force-recreate safesport-api safesport-nginx

      - name: Verify deployment
        run: |
          cd "$DEPLOY_DIR"
          compose=(docker compose --env-file .env.compose -f docker-compose.prod.yml)
          for _ in {1..30}; do
            if docker exec safesport-api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"; then
              "${compose[@]}" ps
              exit 0
            fi
            sleep 5
          done
          "${compose[@]}" ps
          "${compose[@]}" logs --tail 150 safesport-api
          exit 1

      - name: Verify public endpoint
        run: |
          for _ in {1..12}; do
            if curl --fail --silent --show-error --max-time 15 \
              https://server.ayothealthsolutions.ke/health; then
              exit 0
            fi
            sleep 5
          done
          docker logs --tail 100 safesport-nginx
          exit 1

      - name: Remove dangling images
        if: always()
        run: docker image prune -f
