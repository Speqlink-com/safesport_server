name: safesport

services:
  safesport-api:
    image: ${DOCKERHUB_USERNAME:-comphortinoe}/safesport-server:${IMAGE_TAG:-latest}
    container_name: safesport-api
    env_file:
      - ${SAFESPORT_ENV_FILE:-.env.prod}
    networks:
      - safesport-net
    expose:
      - "8000"
    volumes:
      - safesport-uploads:/app/uploads
    depends_on:
      safesport-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 45s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G

  safesport-postgres:
    image: postgres:17-alpine
    container_name: safesport-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safesport}
      POSTGRES_USER: ${POSTGRES_USER:-safesport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    networks:
      - safesport-net
    expose:
      - "5432"
    volumes:
      - safesport-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  safesport-nginx:
    image: nginx:1.29-alpine
    container_name: safesport-nginx
    ports:
      - "2053:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - safesport-net
    depends_on:
      safesport-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider --no-check-certificate https://localhost/health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

networks:
  safesport-net:
    name: safesport-net
    driver: bridge

volumes:
  safesport-postgres-data:
    name: safesport-postgres-data
  safesport-uploads:
    name: safesport-uploads
